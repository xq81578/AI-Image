<body>
  <main class="app">
    <header class="header">
      <div class="brand"><div class="logo">↔</div><div><h1>时光对照</h1></div></div>
      <div class="header-right"><div class="model-summary">文本 <b>北海 · GPT-5.5</b>　 /　 生图 <b>GPT Image 2 · medium</b></div><button id="configButton">⚙ 模型配置</button></div>
    </header>
    <div class="demo-bar"><div class="demo-caption"><b>设计预览</b>模拟数据</div><nav class="segmented" aria-label="切换演示状态"><button data-view="idle">待开始</button><button data-view="running" class="active">生成中</button><button data-view="done">已完成</button><button data-view="error">失败重试</button></nav></div>
    <nav class="journey" aria-label="创作流程" id="journey"></nav>
    <section class="workspace">
      <section class="stage direction"><header class="stage-head"><div class="stage-title"><span class="stage-num">01</span><h2>创作方向</h2></div><span class="tag">起点</span></header><div class="stage-body">
        <label>创作方向<textarea id="brief">小时候奶奶家的院子，夏天乘凉的傍晚。二十多年后，再回去看看。</textarea></label>
        <div class="fields"><label>主题<select><option>老家院子</option><option>农村老屋</option><option>村庄变迁</option><option>亲情</option><option>校园</option><option>老街</option><option>老物件</option></select></label><label>情绪<select><option>怀旧</option><option>温暖</option><option>遗憾</option><option>治愈</option></select></label><label>发布平台<select><option>小红书</option><option>抖音</option><option>视频号</option><option>公众号</option></select></label><label>灵感数量<select><option>6 个</option><option>3 个</option><option>9 个</option><option>12 个</option></select></label></div>
        
      </div><footer class="stage-foot"><button class="primary" id="ideasButton">生成灵感 →</button></footer></section>
      <section class="stage" id="ideasStage"><header class="stage-head"><div class="stage-title"><span class="stage-num">02</span><h2>选择灵感</h2></div><span class="tag" id="ideasBadge"></span></header><div class="stage-body" id="ideasBody"></div><footer class="stage-foot"><button class="primary" id="promptsButton">生成作图提示词 →</button></footer></section>
      <section class="stage" id="promptsStage"><header class="stage-head"><div class="stage-title"><span class="stage-num">03</span><h2>确认提示词</h2></div><span class="tag" id="promptsBadge"></span></header><div class="stage-body" id="promptsBody"></div><footer class="stage-foot"><div id="promptControls" class="hidden"><div class="image-options"><label>生图模型<select><option>北海 · GPT Image 2</option><option>OpenAI · GPT Image 2</option><option>Gemini · Nano Banana</option></select></label><label>比例<select><option>4:5</option><option>1:1</option><option>9:16</option><option>16:9</option></select></label></div><div class="prompt-actions"><button class="quiet" id="rewriteButton">↻ 重写提示词</button><button class="quiet" id="copyPrompt">复制合图提示词</button></div></div><button class="primary" id="imagesButton">生成两张对照图 →</button></footer></section>
      <section class="stage" id="imagesStage"><header class="stage-head"><div class="stage-title"><span class="stage-num">04</span><h2>对照成片</h2></div><span class="tag" id="imagesBadge"></span></header><div class="stage-body" id="imagesBody" aria-live="polite"></div><footer class="stage-foot"><button id="exportButton" disabled>下载图片与配文</button></footer></section>
    </section>
    <footer class="footer"><span><i class="dot"></i><span id="globalStatus">正在生成现在的照片</span></span><span id="totalTime">本次累计 <strong>01:36</strong></span></footer>
  </main>
  <dialog id="detailDialog"><header class="modal-head"><div><h2 id="detailTitle"></h2><p id="detailSubtitle"></p></div><button class="close" aria-label="关闭">×</button></header><div class="modal-body" id="detailBody"></div></dialog>
  <dialog id="configDialog"><header class="modal-head"><div><h2>模型配置</h2></div><button class="close" aria-label="关闭">×</button></header><div class="modal-body"><div class="config-grid"><section><h3>01　文本模型</h3><label>服务<select><option>北海 AI</option><option>DeepSeek</option><option>OpenAI</option><option>Gemini</option></select></label><label>模型<select><option>gpt-5.5</option><option>gpt-5.6-luna</option></select></label><label>API Key<input type="password" placeholder="填写文本服务的 Key" autocomplete="off"></label></section><section><h3>02　生图模型</h3><label>服务<select><option>北海 AI</option><option>OpenAI</option><option>Gemini</option></select></label><label>模型<select><option>gpt-image-2</option></select></label><label>图片质量<select><option>标准 · medium</option><option>精细 · high</option><option>快速 · low</option></select></label></section></div><p class="config-note">配置预览，不保存 Key。</p><div class="modal-actions"><button class="primary" id="configDone">完成预览</button></div></div></dialog>
  <div class="toast hidden" id="toast" role="status"></div>
  <script>
    const $ = s => document.querySelector(s);
    const ideas = [
      ['院子还在，喊我吃饭的人不在了','奶奶家的院子 · 亲情 · 夏日傍晚'],
      ['那张竹床，装下了一整个夏天','老屋门前 · 童年 · 乘凉'],
      ['再也没有人站在门口等我','木门与石阶 · 等待 · 回乡'],
      ['树长高了，院子却安静了','院中老树 · 岁月 · 空置'],
      ['小时候很远的路，现在几步就到','村口小路 · 长大 · 重逢'],
      ['旧照片里的灯，还亮在记忆里','堂屋灯光 · 团圆 · 怀念']
    ];
    let selected=0, view='running', busy=false, job=0, timer=null, toastTimer=null, phase='images', photoReady=true;
    let oldTime=42, nowTime=56;
    let elapsed={ideas:8,prompts:18,images:70}, started=0, base=0;
    let promptOld='2000年前后，奶奶家的砖瓦院子。固定视角望向堂屋木门，左侧是一棵老树，门前摆着竹椅。夏日傍晚，一家人在院中乘凉。呈现家庭旧相片的低清、褪色和细小划痕，保留朴素的生活感。画面不出现文字与年份。';
    let promptNow='2026年，从与旧照相同的位置拍摄同一座院子。保持屋脊、木门、窗户和老树的位置。竹椅已经不在，门前有零散杂草，木门紧闭，院中无人。普通手机的真实画质，自然光。只参考旧照片内部的地点，不保留相纸与翻拍边框。';
    const fmt = n => `${String(Math.floor(n/60)).padStart(2,'0')}:${String(Math.floor(n%60)).padStart(2,'0')}`;
    const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function art(now=false){return `<svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${now?'现在':'旧照'}院落构图示意"><rect width="240" height="300" fill="${now?'#e3e8dd':'#e6dcc4'}"/><circle cx="190" cy="48" r="22" fill="${now?'#eff0e4':'#f2e6bd'}"/><path d="M0 136Q45 98 90 120T240 111V208H0" fill="${now?'#b7c5b0':'#b9bb96'}"/><path d="M0 211L240 184V300H0" fill="${now?'#c4c6b4':'#cec2a4'}"/><path d="M51 117H222V223H51Z" fill="${now?'#afb3a1':'#c5b697'}"/><path d="M38 122L79 82H201L236 122Z" fill="${now?'#78837b':'#8d8874'}"/><path d="M44 120H232M58 109H222M67 98H213" stroke="${now?'#919b8e':'#a7a08a'}" stroke-width="3"/><path d="M119 151H160V220H119Z" fill="#686e5d"/><path d="M139 153V219M123 168H156" stroke="#8f937b"/><path d="M70 151H100V185H70ZM178 151H207V185H178Z" fill="#777f69"/><path d="M85 151V185M70 168H100M192 151V185M178 168H207" stroke="#b5b79c" stroke-width="3"/><path d="M44 230Q56 151 32 82" stroke="#7d8266" stroke-width="11" fill="none"/><path d="M45 156L14 105M41 133L74 87" stroke="#7d8266" stroke-width="6"/><g fill="${now?'#859c7f':'#9da77b'}"><circle cx="29" cy="71" r="34"/><circle cx="61" cy="77" r="29"/><circle cx="2" cy="99" r="29"/></g>${now?'<g stroke="#859c73" stroke-width="2"><path d="M92 243l-6-20m6 20 8-17m68 21-4-19m4 19 9-15M209 232l-4-16m4 16 7-14M20 272l-4-22m4 22 8-19"/></g>':'<g stroke="#9c8e69" stroke-width="4" fill="none"><path d="M77 207v40m21-40v40m-21-18h21m-21-20h21"/><path d="M174 209v35m19-35v35m-19-18h19"/></g><circle cx="146" cy="208" r="7" fill="#a58e74"/><path d="M145 216v24m0-15-10 10m10-9 10 9m-10 5-7 14m7-14 7 14" stroke="#858c76" stroke-width="7"/>'}<path d="M113 222L78 300M163 222L211 300" stroke="${now?'#d9dacb':'#ded2b7'}" stroke-width="2"/><rect x="8" y="8" width="224" height="284" fill="none" stroke="#ffffff33"/><text x="120" y="282" text-anchor="middle" fill="#6e765f" font-family="sans-serif" font-size="8" letter-spacing="2">构图示意 · 非生成照片</text></svg>`;}
    function empty(n,text){return `<div class="empty"><span class="empty-icon">${n}</span><p>${text}</p></div>`;}
    function loading(text,t){return `<div class="run-box"><div class="run-line"><i class="spinner"></i><span>${text}</span><b data-timer="${t}">${fmt(elapsed[t])}</b></div><div class="activity"></div></div>`;}
    function renderJourney(){
      const names=['创作方向','选择灵感','确认提示词','对照成片'];
      const completed=view==='idle'?0:phase==='ideas'?0:phase==='prompts'?1:view==='done'?3:2;
      $('#journey').innerHTML=names.map((name,i)=>{const done=i===0||i<=completed;const running=i>0&&phase===['','ideas','prompts','images'][i]&&view==='running';const error=i===3&&view==='error';let sub=i===0?'方向已填写':done?`已完成 · ${fmt(elapsed[['','ideas','prompts','images'][i]])}`:running?'进行中 · '+fmt(elapsed[phase]):error?'参考图读取失败':'等待上一步';return `<div class="journey-step ${error?'error':running?'running':done?'done':''}"><span class="step-disc">${done?'✓':error?'!':String(i+1).padStart(2,'0')}</span><div><h3>${name}</h3><small ${running?'id="journeyClock"':''}>${sub}</small></div></div>`;}).join('');
    }
    function render(){
      renderJourney();
      document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',b.dataset.view===view);});
      const hasIdeas=view!=='idle'&&phase!=='ideas',hasPrompts=hasIdeas&&phase!=='prompts';
      $('#ideasBadge').textContent=hasIdeas?'6 条灵感':phase==='ideas'&&view==='running'?'生成中':'待开始';
      $('#ideasBody').innerHTML=hasIdeas?`<div class="idea-list">${ideas.map((x,i)=>`<button class="idea ${i===selected?'selected':''}" data-idea="${i}" ${busy?'disabled':''} aria-pressed="${i===selected}"><span class="idea-no">${String(i+1).padStart(2,'0')}</span><span class="idea-text"><h3>${x[0]}</h3><p>${x[1]}</p></span>${i===selected?'<span class="idea-check">✓</span>':''}</button>`).join('')}</div><div style="height:8px"></div><button class="quiet" id="ideaDetail">灵感详情 ↗</button><button class="quiet" id="titleDetail" style="float:right">短视频标题 ↗</button>`:view==='running'?loading('正在寻找灵感','ideas')+'<div class="loading-placeholder"></div><div class="loading-placeholder"></div><div class="loading-placeholder"></div>':empty('02','等待生成灵感');
      $('#promptsBody').classList.toggle('has-prompts',hasPrompts);
      $('#promptControls').classList.toggle('hidden',!hasPrompts);
      $('#rewriteButton').disabled=busy;
      $('#promptsBadge').textContent=hasPrompts?'可编辑':phase==='prompts'&&view==='running'?'生成中':'待开始';
      $('#promptsBody').innerHTML=hasPrompts?`<button class="prompt-card" data-prompt="old"><div class="prompt-top"><h3><i class="prompt-dot"></i>2000 年前后</h3><span class="tag">旧照</span></div><p>${esc(promptOld)}</p><span class="expand">编辑 ↗</span></button><button class="prompt-card" data-prompt="now"><div class="prompt-top"><h3><i class="prompt-dot now"></i>2026 年</h3><span class="tag green">现在</span></div><p>${esc(promptNow)}</p><span class="expand">编辑 ↗</span></button>`:view==='running'&&phase==='prompts'?loading('正在编写两段提示词','prompts')+'<div class="loading-placeholder" style="height:120px"></div><div class="loading-placeholder" style="height:120px"></div>':empty('03','等待生成提示词');
      $('#imagesBadge').textContent=view==='done'?'2 / 2 已完成':view==='error'?'1 / 2 已保留':hasPrompts&&photoReady?'1 / 2 已完成':'待生成';
      let imageContent=empty('04','等待生成图片');
      if(hasPrompts&&view!=='ready'){
        let status=view==='done'?`<div class="result-status"><span>✓ 两张照片已完成</span><small>耗时 ${fmt(elapsed.images)}</small></div>`:view==='error'?'<div class="run-box error-box"><div class="run-line"><span>! 参考图读取失败</span><b>01:10</b></div><p>旧照已保留，第二张尚未开始生成。</p><button id="retryButton">重试第二张 →</button></div>':loading(photoReady?'正在生成现在的照片':'正在生成旧照片','images');
        imageContent=status+`<div class="image-pair"><button class="photo" data-photo="old" ${photoReady?'':'disabled'} aria-label="放大旧照片"><span class="photo-surface">${photoReady?art(false):'<span class="waiting-photo"><i class="spinner"></i><span>绘制旧日记忆…</span></span>'}<span class="photo-label">2000 年前后</span>${photoReady?'<span class="zoom-mark">↗</span>':''}</span><span class="photo-meta"><span>旧照片</span><small>${photoReady?'完成 · '+fmt(oldTime):'生成中'}</small></span></button><button class="photo" data-photo="now" ${view==='done'?'':'disabled'} aria-label="放大现在照片"><span class="photo-surface">${view==='done'?art(true):`<span class="waiting-photo">${view==='error'?'<span style="font-size:22px">↻</span>':photoReady?'<i class="spinner"></i>':'<span style="font-size:22px">◷</span>'}<span>${view==='error'?'等待重试':photoReady?'生成中…':'等待旧照完成'}</span></span>`}<span class="photo-label">2026 年</span>${view==='done'?'<span class="zoom-mark">↗</span>':''}</span><span class="photo-meta"><span>现在</span><small>${view==='done'?'完成 · '+fmt(nowTime):view==='error'?'未生成':'等待结果'}</small></span></button></div><div class="caption-box"><div class="prompt-top"><h3>配文</h3><button class="quiet" id="captionDetail">展开 / 编辑 ↗</button></div><p id="captionSummary">${esc(caption)}</p></div>`;
      }
      $('#imagesBody').innerHTML=imageContent;
      ['ideas','prompts','images'].forEach(p=>$('#'+p+'Stage').classList.toggle('active-stage',view==='running'&&phase===p));
      $('#ideasButton').disabled=busy;$('#promptsButton').disabled=!hasIdeas||busy;$('#imagesButton').disabled=!hasPrompts||busy;$('#exportButton').disabled=view!=='done';
      $('#globalStatus').textContent=view==='idle'?'待开始':view==='done'?'创作完成':view==='error'?'流程暂停 · 旧照片已保留，可重试第二张':phase==='ideas'?'正在生成选题灵感':phase==='prompts'?'正在编写作图提示词':photoReady?'正在生成现在的照片 · 旧照已保留':'正在生成旧照片';
      tick();
    }
    let caption='小时候总觉得这个院子很小，长大后才发现，它装着我再也回不去的整个夏天。';
    function tick(){if(busy)elapsed[phase]=base+(performance.now()-started)/1000;document.querySelectorAll('[data-timer]').forEach(el=>el.textContent=fmt(elapsed[el.dataset.timer]));if($('#journeyClock'))$('#journeyClock').textContent='进行中 · '+fmt(elapsed[phase]);$('#totalTime').innerHTML=`${busy?'演示累计':'示例累计'} <strong>${fmt(elapsed.ideas+elapsed.prompts+elapsed.images)}</strong>`;}
    function setView(v){oldTime=42;nowTime=56;job++;clearInterval(timer);view=v;busy=v==='running';phase='images';photoReady=v!=='idle';elapsed=v==='idle'?{ideas:0,prompts:0,images:0}:v==='done'?{ideas:8,prompts:18,images:98}:{ideas:8,prompts:18,images:70};base=elapsed.images;started=performance.now();render();if(busy)timer=setInterval(tick,250);}
    function begin(p){job++;clearInterval(timer);phase=p;view='running';busy=true;base=0;elapsed[p]=0;started=performance.now();if(p==='ideas'){elapsed.prompts=0;elapsed.images=0;}if(p==='prompts')elapsed.images=0;render();timer=setInterval(tick,100);return job;}
    const delay = ms => new Promise(r=>setTimeout(r,ms));
    async function generateIdeas(){const token=begin('ideas');await delay(2000);if(token!==job)return;tick();busy=false;clearInterval(timer);phase='prompts';view='idle';renderReady('ideas');}
    function renderReady(stage){view='ready';phase=stage==='ideas'?'prompts':'images';render();if(stage==='ideas'){$('#promptsBody').innerHTML=empty('03','等待生成提示词');$('#promptsBadge').textContent='待生成';}else{$('#imagesBody').innerHTML=empty('04','等待生成图片');$('#imagesBadge').textContent='待生成';}$('#globalStatus').textContent=stage==='ideas'?'灵感已生成':'提示词已完成';renderJourney();}
    async function generatePrompts(){const token=begin('prompts');await delay(2400);if(token!==job)return;tick();busy=false;clearInterval(timer);photoReady=false;renderReady('prompts');}
    async function generateImages(retry=false){if(!retry)oldTime=0;nowTime=0;photoReady=retry;const token=begin('images');if(!retry){await delay(2200);if(token!==job)return;tick();oldTime=elapsed.images;photoReady=true;render();}await delay(2800);if(token!==job)return;tick();nowTime=retry?elapsed.images:elapsed.images-oldTime;busy=false;clearInterval(timer);view='done';render();}
    function modal(title,subtitle,content){$('#detailTitle').textContent=title;$('#detailSubtitle').textContent=subtitle;$('#detailBody').innerHTML=content;$('#detailDialog').showModal();}
    function openPrompt(which){const old=which==='old';modal(old?'旧照片提示词':'现在的照片提示词','',`<label>完整提示词</label><textarea id="promptEdit">${esc(old?promptOld:promptNow)}</textarea><div class="modal-actions"><button id="savePrompt" class="primary">保存修改</button></div>`);$('#savePrompt').onclick=()=>{if(old)promptOld=$('#promptEdit').value;else promptNow=$('#promptEdit').value;$('#detailDialog').close();render();notify('提示词已更新（仅本次设计预览）');};}
    function notify(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),2800);}
    document.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.view){setView(b.dataset.view);return;}
      if(b.dataset.idea!==undefined){selected=Number(b.dataset.idea);elapsed.prompts=0;elapsed.images=0;photoReady=false;renderReady('ideas');return;}
      if(b.dataset.prompt){openPrompt(b.dataset.prompt);return;}
      if(b.dataset.photo){modal(b.dataset.photo==='old'?'2000 年前后 · 旧照':'2026 年 · 现在','构图占位示意 · 实际使用时展示完整原图，保持原始比例',`<div class="large-art">${art(b.dataset.photo==='now')}</div>`);return;}
      if(b.classList.contains('close')){b.closest('dialog').close();return;}
      if(b.id==='retryButton')generateImages(true);
      if(b.id==='rewriteButton')generatePrompts();
      if(b.id==='ideaDetail')modal(ideas[selected][0],'灵感详情',`<span class="tag green">${ideas[selected][1]}</span><p style="line-height:2.2;margin-top:16px">用同一个院子的两张照片，讲述二十多年的变化。旧照里有家人、竹椅和傍晚的烟火气；现在的照片里，建筑与老树的位置没变，院子却安静下来。把变化留给细节，让同一个视角连接两个年代。</p>`);
      if(b.id==='titleDetail')modal('短视频标题','',ideas.slice(0,4).map(x=>`<button class="idea title-copy" style="margin-bottom:8px">${x[0]}<span style="margin-left:auto;font-size:10px;color:#8a9683">复制</span></button>`).join(''));
      if(b.id==='captionDetail'){modal('配文','',`<textarea id="captionEdit">${esc(caption)}</textarea><div class="modal-actions"><button class="primary" id="saveCaption">保存配文</button></div>`);$('#saveCaption').onclick=()=>{caption=$('#captionEdit').value;$('#detailDialog').close();render();};}
      if(b.id==='copyPrompt')copy(promptOld+'\n\n'+promptNow);
      if(b.classList.contains('title-copy'))copy(b.childNodes[0].textContent);
    });
    async function copy(text){try{await navigator.clipboard.writeText(text);notify('已复制');}catch{notify('当前预览环境不支持复制，请展开后手动复制');}}
    $('#ideasButton').onclick=generateIdeas;$('#promptsButton').onclick=generatePrompts;$('#imagesButton').onclick=()=>generateImages();
    $('#configButton').onclick=()=>$('#configDialog').showModal();$('#configDone').onclick=()=>$('#configDialog').close();
    $('#exportButton').onclick=()=>notify('设计预览：正式接入后可下载原图与配文');
    document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}}));
    setView('running');
  </script>
</body>
</html>
